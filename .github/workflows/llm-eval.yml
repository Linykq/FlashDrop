name: LLM eval

# The listing generator against the live Anthropic API (design §10): `pnpm eval:listings` on its ten
# known-answer cases, reporting the schema pass rate, field accuracy, cost and cache reads per effort. It
# spends real money, so it runs only when started by hand; CI proper never calls a model and needs no secret
# (it runs the fixtures instead).
#
# With `record`, it re-records the fixtures instead (§13): one job per photo in tests/fixtures/images at the
# first effort, each job's raw answers uploaded as the `recorded-fixtures` artifact. Nothing is pushed: a
# person reviews them and commits the ones that replace hand-written fixtures (tests/fixtures/README.md).
on:
  workflow_dispatch:
    inputs:
      effort:
        description: Effort levels to sweep, comma-separated (low, medium, high, xhigh, max); record uses the first
        required: true
        default: low,medium
      model:
        description: Model id (empty for LISTING_MODEL's default, claude-sonnet-5-5)
        required: false
        default: ''
      record:
        description: Re-record the fixtures instead of running the eval
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eval:
    name: ${{ inputs.record && 'Record listing fixtures' || 'Listing eval' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Environment protection rules (required reviewers) can gate the secret further.
    environment: llm-eval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:native
      - name: Run the eval
        if: ${{ !inputs.record }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EFFORT: ${{ inputs.effort }}
          MODEL: ${{ inputs.model }}
        # Inputs reach the shell as environment variables, never interpolated into the script.
        run: pnpm eval:listings --effort "$EFFORT" ${MODEL:+--model "$MODEL"} --out eval-listings-report.json
      - name: Upload the report
        if: ${{ always() && !inputs.record }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-listings-report
          path: eval-listings-report.json
          if-no-files-found: ignore
          retention-days: 30
      # Into the runner's temporary directory, not the checkout: the committed fixtures stay as they are.
      - name: Record the fixtures
        if: ${{ inputs.record }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EFFORT: ${{ inputs.effort }}
          MODEL: ${{ inputs.model }}
        run: pnpm eval:listings --effort "$EFFORT" ${MODEL:+--model "$MODEL"} --record "$RUNNER_TEMP/recorded-fixtures"
      - name: Upload the recordings
        if: ${{ always() && inputs.record }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recorded-fixtures
          path: ${{ runner.temp }}/recorded-fixtures/
          if-no-files-found: error
          retention-days: 30
