# Redis for FlashDrop (design §4, §15). Mounted read-only into the redis container by compose.yaml.

# Reachable from the Compose network; the host port is published on 127.0.0.1 only.
bind * -::*
protected-mode no
port 6379
dir /data

# Durability: the AOF is fsynced once per second and also persists the Functions library (§4.2, §4.7).
appendonly yes
appendfsync everysec

# Memory: never evict a key. A write that does not fit fails up front, and the write Functions are
# registered without allow-oom, so a script never applies half its writes (§4.2).
maxmemory 256mb
maxmemory-policy noeviction
