# FlashDrop local stack (design §15).
#
#   pnpm infra:up    data stores, then the one-shot kafka-init (`up --wait` does not wait for one-shot jobs)
#   pnpm infra:down  stops the stack; named volumes keep the data
#   pnpm stack:up    builds the images (docker-bake.hcl), then the full stack on http://127.0.0.1:8080
#   pnpm stack:down  removes the application containers; the data stores keep running
#   docker compose --profile tools up -d kafka-ui    Kafka UI on http://127.0.0.1:8081
#
# compose.ci.yaml holds CI's overrides; compose.isolated.yaml adds a second stack on other host ports, for
# the system tests, which stop and pause services others on the machine use.
#
# Replaying dead letters against this stack (design §6.4) runs inside its network, as a one-off of the
# consumers service, because payment-mock is reachable only there (flags: --only, --from-offset, --dry-run):
#   pnpm dlq:replay  docker compose --profile app run --rm --no-deps consumers node apps/worker/dist/dlq-replay.js
#
# Every published port binds to 127.0.0.1. Images are pinned by tag and multi-arch index digest, except the
# two built here. The application services run under the "app" profile and depend on `kafka-init` and
# `migrate` with `condition: service_completed_successfully`, because `up --wait` treats a running one-shot
# job as ready.

name: flashdrop

# Shared by the application services built from this repo (profile: app).
x-app-service: &app-service
  profiles: [app]
  # The images exist only locally, from `docker buildx bake`. Never pull: a missing image must fail rather
  # than fetch a namesake from Docker Hub.
  pull_policy: never
  # tini as PID 1 forwards SIGTERM to Node and reaps children.
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # A process that dies by itself comes back instead of leaving payments or expiry stopped until someone
  # notices: librdkafka can abort the process on a broker restart, and a worker started while Kafka is
  # unreachable exits 1. `docker compose stop` and `kill` are manual stops, which Docker never undoes, so the
  # system tests' failure injection stays in place. CI fails a job in which any app container restarted
  # (tools/check-restarts.sh), so a restart never hides a crash. The one-shot `migrate` opts out.
  restart: unless-stopped

# Inside the Compose network: service names and the containers' ports, not the host's 127.0.0.1:5433.
x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://flashdrop:flashdrop@postgres:5432/flashdrop
  REDIS_URL: redis://redis:6379
  KAFKA_BROKERS: kafka:19092
  UPLOAD_DIR: /data/uploads

# Probes every second while a container starts, so `up --wait` returns soon after it is ready.
x-app-healthcheck: &app-healthcheck
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 60s
  start_interval: 1s

services:
  # ---------------------------------------------------------------- data stores (always on)

  postgres:
    image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    # The default of 100 is too few for this shared dev and CI server: `pnpm test:int` runs its files in
    # parallel, each with its own pools (the reserve and sweeper concurrency tests open up to 40 each), next
    # to the running stack's api, worker and drop-lock pools. Past the limit a connect fails with 53300 "too
    # many clients already", which surfaces as a random test failure. Idle backends cost little memory.
    command: [postgres, -c, max_connections=300]
    environment:
      POSTGRES_USER: flashdrop
      POSTGRES_PASSWORD: flashdrop
      POSTGRES_DB: flashdrop
    ports:
      # 5433: the native PostgreSQL on this machine keeps 5432.
      - 127.0.0.1:5433:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: during first-run initialisation the server listens on the Unix socket only, so a socket
      # check would report healthy before the real server is up.
      test: [CMD, pg_isready, --host=127.0.0.1, --username=flashdrop, --dbname=flashdrop]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.2@sha256:6f81e8915c60b065a524e6967e0ad1c639ba6efa84d669f823683ea04d9150ee
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30

  # The integration tests' own Redis (vitest.config.ts points them here). The Functions library is global
  # to a Redis, so a test run from an edited working tree must never load its Lua into the Redis the running
  # stack executes, nor test against the stack's copy (§4.2, §13). The same server and configuration as
  # `redis`, with its data on a tmpfs: tests create fresh drops and delete their keys.
  redis-test:
    image: redis:8.10.2@sha256:6f81e8915c60b065a524e6967e0ad1c639ba6efa84d669f823683ea04d9150ee
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    ports:
      - 127.0.0.1:6380:6379
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    tmpfs:
      - /data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    ports:
      - 127.0.0.1:9092:9092
    environment:
      # Setting any KAFKA_* variable replaces the image's default configuration, so the whole single-node
      # KRaft set is spelled out. Without the replication-factor overrides, __consumer_offsets cannot be
      # created on one broker and consumer groups never come up.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      # Containers use kafka:19092; Node on the Windows host uses 127.0.0.1:9092.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # A new consumer group gets its partitions at once instead of after the default 3 s delay.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics exist only through kafka-init, so a typo in a topic name fails instead of creating one.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1
      # Each check starts a JVM for about a second of CPU, so it runs every 2 s only while the broker starts
      # (`up --wait` stays fast) and every 30 s after that. start_interval needs Docker Engine 25 or later.
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s

  # ---------------------------------------------------------------- one-shot jobs

  kafka-init:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    entrypoint: [sh, /opt/flashdrop/create-topics.sh]
    volumes:
      - ./infra/kafka/create-topics.sh:/opt/flashdrop/create-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: 'no'

  # ---------------------------------------------------------------- tools (profile: tools)

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    profiles: [tools]
    ports:
      - 127.0.0.1:8081:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: flashdrop
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8080/actuator/health]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # ---------------------------------------------------------------- load tests (profile: load)

  # k6 runs the TypeScript scripts of tests/load natively (§13), through Caddy like a browser, against a
  # stack that is already up with the test routes and the load profile's rate limits:
  #   ENABLE_TEST_ROUTES=true RATE_LIMIT_IP_PER_SEC=100000 RATE_LIMIT_USER_PER_SEC=1000 pnpm stack:up
  # (CI: compose.ci.yaml). No depends_on, so a run never starts or rebuilds the stack under test.
  # `pnpm load:burst`:
  #   docker compose --profile load run --rm k6 run /scripts/burst.ts -e PROFILE=ci
  k6:
    image: grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34
    profiles: [load]
    # The results bind mount is created by Docker (root) or the CI runner, never by the image's k6 user.
    user: root
    working_dir: /scripts
    environment:
      BASE_URL: http://caddy:8080
      # api's CSRF guard admits only WS_ALLOWED_ORIGINS on mutating requests (§11).
      ORIGIN: http://127.0.0.1:8080
      TEST_SECRET: ${TEST_ROUTES_SECRET:-dev-only-test-routes-secret}
      RESULTS_DIR: /results
      K6_NO_USAGE_REPORT: 'true'
    volumes:
      - ./tests/load:/scripts:ro
      - ./tests/load/results:/results

  # ---------------------------------------------------------------- application (profile: app)

  migrate:
    <<: *app-service
    image: flashdrop/node:${IMAGE_TAG:-dev}
    # Migrations, then the demo seed (and its photos into the uploads volume), which also arms the seeded
    # drops in Redis (tools/seed.ts); it runs on every `stack:up`. The directories are explicit because the
    # bundles resolve paths from their own location (Dockerfile.node).
    command:
      - sh
      - -c
      - >-
        node packages/db/dist/cli/migrate.js --migrations-dir /app/packages/db/drizzle
        && exec node tools/dist/seed.js --catalog-dir /app/assets/catalog
    environment:
      <<: *app-env
      # Lets payment-mock's role log in with this password (migration 0007 creates it without LOGIN); the
      # same value is in payment-mock's PSP_DATABASE_URL below.
      PSP_DB_PASSWORD: ${PSP_DB_PASSWORD:-dev-only-psp-db-password}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      # The seed arms its drop through the same service as the admin route, which syncs Redis (§15).
      redis:
        condition: service_healthy
    # A one-shot job: the app services wait for it to complete.
    restart: 'no'

  api-1: &api
    <<: *app-service
    image: flashdrop/node:${IMAGE_TAG:-dev}
    hostname: api-1
    command: [node, apps/api/dist/main.js]
    environment:
      <<: *app-env
      # All interfaces: Caddy and web reach the api over the Compose network.
      HOST: 0.0.0.0
      PORT: '4000'
      API_ROLES: http,ws
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-not-for-production}
      WS_ALLOWED_ORIGINS: http://127.0.0.1:8080
      # `ENABLE_TEST_ROUTES=true pnpm stack:up` mounts /api/v1/test/* for Playwright and k6 (§13).
      ENABLE_TEST_ROUTES: ${ENABLE_TEST_ROUTES:-false}
      TEST_ROUTES_SECRET: ${TEST_ROUTES_SECRET:-dev-only-test-routes-secret}
      # Reserve rate limits (§11). k6 sends everything from one IP through Caddy, so a load run raises both:
      # `RATE_LIMIT_IP_PER_SEC=100000 RATE_LIMIT_USER_PER_SEC=1000` (compose.ci.yaml does the same).
      RATE_LIMIT_IP_PER_SEC: ${RATE_LIMIT_IP_PER_SEC:-100}
      RATE_LIMIT_USER_PER_SEC: ${RATE_LIMIT_USER_PER_SEC:-10}
      # Approving a listing asks web to revalidate the product's cache tag (§8.1, §10).
      WEB_INTERNAL_URL: http://web:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-only-revalidate-secret-not-for-production}
    networks:
      default:
        # `api` resolves to both instances, for web's server-side calls (API_INTERNAL_URL).
        aliases: [api]
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *app-healthcheck
      test: [CMD, node, healthcheck.mjs, http://127.0.0.1:4000/api/v1/health]

  api-2:
    <<: *api
    hostname: api-2

  # The singleton background loops (design §2, §4.6, §4.7, §5.4). Each loop elects itself per tick through a
  # Postgres advisory lock, and the relay fences each batch with one, so a second replica would only stand by.
  # Nothing else runs in this process: while it is down, nothing publishes the outbox or expires an order.
  worker:
    <<: *app-service
    image: flashdrop/node:${IMAGE_TAG:-dev}
    hostname: worker
    command: [node, apps/worker/dist/main.js]
    environment:
      <<: *app-env
      WORKER_ROLES: relay,sweeper,reconciler
      # The drop scheduler asks web to revalidate its cached drop list on every status transition (§4.6, §8.1).
      WEB_INTERNAL_URL: http://web:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-only-revalidate-secret-not-for-production}
    depends_on:
      # The seed has armed the drops the loops will look after.
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      # The relay publishes to orders.v1, which only kafka-init creates.
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *app-healthcheck
      # Healthy while every loop of every role completes its ticks and the relay its batches
      # (apps/worker/src/health.ts).
      test: [CMD, node, healthcheck.mjs, http://127.0.0.1:4200/health]

  # The LLM listing generator (design §10): the worker image with the listing role alone, so a provider or
  # fixture failure, and the restarts it causes, never take the relay, expiry or the settle safety net down
  # with it, and the API key and the photos stay out of their process. Jobs are claimed with SKIP LOCKED and
  # fenced by a lease, so a second replica would share the queue.
  #
  # The provider is the recorded fixtures (tests/fixtures) unless the shell or .env says otherwise: a key
  # alone never switches it, so `pnpm test:e2e` asserts on the fixtures and costs nothing whoever runs it. A
  # live demo opts in:  LLM_PROVIDER=anthropic ANTHROPIC_API_KEY=sk-... pnpm stack:up
  listing:
    <<: *app-service
    image: flashdrop/node:${IMAGE_TAG:-dev}
    hostname: listing
    command: [node, apps/worker/dist/main.js]
    environment:
      <<: *app-env
      WORKER_ROLES: listing
      LLM_PROVIDER: ${LLM_PROVIDER:-fixture}
      LISTING_MODEL: ${LISTING_MODEL:-claude-sonnet-5-5}
      LISTING_EFFORT: ${LISTING_EFFORT:-low}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      # The photos api stored for listing jobs; this service only reads them.
      - uploads:/data/uploads:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Job status goes to the uploader's user topic through Redis pub/sub (§7, §10).
      redis:
        condition: service_healthy
    healthcheck:
      <<: *app-healthcheck
      # Healthy while the claim loop completes its ticks (apps/worker/src/health.ts).
      test: [CMD, node, healthcheck.mjs, http://127.0.0.1:4200/health]

  # The money consumer groups (design §6.3, §6.5): the same image and entry as `worker`, other roles. Two
  # replicas share each group's 6 partitions, so killing one shows a rebalance: `docker kill
  # flashdrop-consumers-1` (`docker compose kill consumers` kills both).
  consumers:
    <<: *app-service
    image: flashdrop/node:${IMAGE_TAG:-dev}
    command: [node, apps/worker/dist/main.js]
    deploy:
      replicas: 2
    environment:
      <<: *app-env
      WORKER_ROLES: payment,settlement
      PAYMENT_MOCK_URL: http://payment-mock:4100
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      payment-mock:
        condition: service_healthy
    healthcheck:
      <<: *app-healthcheck
      # Healthy only while each of its groups owns a partition (§6.4), so `up --wait` returns once the
      # consumers can actually receive events.
      test: [CMD, node, healthcheck.mjs, http://127.0.0.1:4200/health]

  # The sales-dashboard group (design §9), apart from the money groups: `pnpm dash:rebuild --compose` stops
  # and starts only this service, so a rebuild during a drop never pauses a charge or a settlement, and its
  # replay of the whole retained topic never shares an event loop with them.
  dashboard-consumers:
    <<: *app-service
    image: flashdrop/node:${IMAGE_TAG:-dev}
    command: [node, apps/worker/dist/main.js]
    deploy:
      replicas: 2
    environment:
      <<: *app-env
      WORKER_ROLES: dashboard
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *app-healthcheck
      # As `consumers`: healthy only while the group owns a partition (§6.4).
      test: [CMD, node, healthcheck.mjs, http://127.0.0.1:4200/health]

  # The simulated PSP (design §6.5), reached by the payment consumers at http://payment-mock:4100. Not
  # published on the host, where a native `pnpm dev` payment-mock owns 4100 (§15), which is why dead letters
  # are replayed from inside the network (see the header). No &app-env: it never gets DATABASE_URL, only its
  # own role, which the migrate job lets log in (PSP_DB_PASSWORD).
  payment-mock:
    <<: *app-service
    image: flashdrop/node:${IMAGE_TAG:-dev}
    hostname: payment-mock
    command: [node, apps/payment-mock/dist/main.js]
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HOST: 0.0.0.0
      PORT: '4100'
      PSP_DATABASE_URL: postgres://flashdrop_psp:${PSP_DB_PASSWORD:-dev-only-psp-db-password}@postgres:5432/flashdrop
      PSP_LATENCY_MS: ${PSP_LATENCY_MS:-100-800}
      PSP_ERROR_RATE: ${PSP_ERROR_RATE:-0.02}
      PSP_TIMEOUT_AFTER_SUCCESS_RATE: ${PSP_TIMEOUT_AFTER_SUCCESS_RATE:-0.01}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *app-healthcheck
      # Ready while the ledger answers as the PSP role.
      test: [CMD, node, healthcheck.mjs, http://127.0.0.1:4100/health]

  web:
    <<: *app-service
    image: flashdrop/web:${IMAGE_TAG:-dev}
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_INTERNAL_URL: http://api:4000
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-not-for-production}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-only-revalidate-secret-not-for-production}
    healthcheck:
      <<: *app-healthcheck
      # A route prerendered at build time, so it shows that the Next server routes requests without calling
      # the api: probing a page would read stock from Postgres every 10 s and tie web's health to the api's.
      test: [CMD, node, healthcheck.mjs, http://127.0.0.1:3000/icon.svg]

  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    profiles: [app]
    # As the app services (x-app-service).
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    healthcheck:
      <<: *app-healthcheck
      # The admin API answers once the config, and with it the :8080 listener, is loaded.
      test: [CMD, wget, --quiet, --output-document=/dev/null, http://127.0.0.1:2019/config/]

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  # Listing photos: written by api, read by the listing service (§10).
  uploads:
